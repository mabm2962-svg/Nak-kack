<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAK KACK App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
            text-align: center;
            border: 2px solid #e50914;
            max-width: 320px;
            width: 90%;
        }
        h1 {
            color: #e50914;
            margin-bottom: 10px;
        }
        p {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        .btn:hover {
            background-color: #b20710;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>NAK KACK</h1>
        <p>សូមស្វាគមន៍មកកាន់ NAK KACK Web App!</p>
        <button class="btn" onclick="alert('អ្នកបានចុចប៊ូតុង NAK KACK!')">ចុចទីនេះ</button>
    </div>

</body>
</html>
